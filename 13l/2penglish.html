  <script type="module">
  import { affichageHTML } from '../js/affichage.js';
  import { loadConfig } from '../js/configLoader.js';

  await loadConfig();

  const set = (selector, html) => {
    const el = document.querySelector(selector);
    if (el) el.innerHTML = html;
  };
  const setId = (id, html) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  };

  set('header', affichageHTML('header','','2p','4'));
  setId('drawer', affichageHTML('drawer','','2p','4'));
  setId('landscapeIcon', affichageHTML('landscapeIcon','','','index'));
  setId('parametres', affichageHTML('parametres','13lenglish','double','english'));
  setId('selectSDQ', affichageHTML('selectSDQ','13lenglish','2pages',''));
  setId('selectLecture', affichageHTML('selectLecture','13lenglish','double',''));
  setId('moushafdouble', affichageHTML('moushafdouble','13lenglish','2pages',''));
  set('footer', affichageHTML('footer','','double', ''));

  if (window.componentHandler && typeof window.componentHandler.upgradeDom === 'function') {
    window.componentHandler.upgradeDom();
  }
</script>
