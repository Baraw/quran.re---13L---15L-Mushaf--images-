<script type="module">
  import { affichageHTML } from '../js/affichage.js';
  import { loadConfig } from '../js/configLoader.js';

  await loadConfig();

  const set = (selector, html) => {
    const el = document.querySelector(selector);
    if (el) el.innerHTML = html;
  };
  const setId = (id, html) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  };

  setId('drawer', affichageHTML('drawer','','2p','2'));
  setId('landscapeIcon', affichageHTML('landscapeIcon','','','vert'));

  setId('selectSDQ', affichageHTML('selectSDQ','13lvert','2pages',''));
  setId('moushafdouble', affichageHTML('moushafdouble','13lvert','2pages',''));
  set('footer', affichageHTML('footer','13lclassic','double', ''));

    window.componentHandler.upgradeDom();
