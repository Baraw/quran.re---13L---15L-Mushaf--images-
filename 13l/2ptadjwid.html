  <script type="module">
  import { affichageHTML } from '../js/affichage.js';
  import { loadConfig } from '../js/configLoader.js';

  await loadConfig();

  const set = (selector, html) => {
    const el = document.querySelector(selector);
    if (el) el.innerHTML = html;
  };
  const setId = (id, html) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  };

  set('header', affichageHTML('header','','2p','0'));
  setId('drawer', affichageHTML('drawer','','2p','0'));
  setId('landscapeIcon', affichageHTML('landscapeIcon','','','index'));
  setId('parametres', affichageHTML('parametres','13lcolored','double','index'));
  setId('selectSDQ', affichageHTML('selectSDQ','13lcolored','2pages',''));
  setId('moushafdouble', affichageHTML('moushafdouble','13lcolored','2pages',''));
  set('footer', affichageHTML('footer','13lcolored','double', ''));

  if (window.componentHandler && typeof window.componentHandler.upgradeDom === 'function') {
    window.componentHandler.upgradeDom();
  }
</script>
