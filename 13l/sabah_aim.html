  <body class="mdl-demo mdl-color--indigo-blue-100 mdl-color-text--indigo-blue-700 mdl-base">
    <div class="mdl-layout mdl-js-layout">

      <header class="mdl-layout__header mdl-layout__header--scroll" id="header">
        <!-- <script>document.querySelector('header').innerHTML = affichageHTML('header','','','6');</script> --> -->
      </header>
      <div class="mdl-layout__drawer" id="drawer">
        <!-- <script>document.getElementById('drawer').innerHTML = affichageHTML('drawer','','','6');</script> --> -->
      </div>

      <main class="mdl-layout__content">
        <!-- AFFICHAGE DES PARAMS -->
        <div id="parametres">
          <!-- <script>document.getElementById('parametres').innerHTML = affichageHTML('parametres','13lsabah_aim','simple','');</script> --> -->
        </div>

        <center>
        
          <!-- CHOIX DES SOURATES, SIPARAS ET QUARTS -->
          <div id="selectSDQ">
          
                <!-- CHOIX DE LA SOURATE -->
              <select id="selectSOURATE" name="selectSOURATE" onchange="quranDisplay.displayPage(this.value);">      </select> <!-- Rajouter pour l'audio -->
                <!-- CHOIX DU SIPARAH -->
              <select id="selectSIPARAH" name="selectSIPARAH" onchange="quranDisplay.displayPage(this.value);">  </select>
              	<!-- CHOIX DU QUART -->
              <select id="selectQUART" name="selectQUART" onchange="selectQUART(document.getElementById('selectSIPARAH').selectedIndex,this.value);" disabled>  </select>
        
            <!-- <script>document.getElementById('selectSDQ').innerHTML = affichageHTML('selectSDQ','13lsabah_aim','simple','');</script> --> -->
          </div>

          <!-- LES BOUTONS DE NAVIGATION ENTRE LES PAGES -->
          
          <!-- SUIVANT PC -->
          <a href="#" onclick="quranDisplay.changePage('next')">
            <div id="pagSuiv" class="gauche13lvert">
              <button class="mdl-button mdl-js-button mdl-button--fab mdl-js-ripple-effect boutonPC">
                <i class="material-icons" style="color:blue">west</i>
              </button>
            </div>
          </a>

          <!-- PRECEDENT PC -->
          <a href="#" onclick="quranDisplay.changePage('prev')">
            <div id="pagPrec" class="droite13lvert">
              <button class="mdl-button mdl-js-button mdl-button--fab mdl-js-ripple-effect boutonPC">
                <i class="material-icons" style="color:red">east</i>
              </button>
            </div>
          </a>

          <!-- LA PAGE AFFICHEE -->
          <div id="moushaf" style="margin:0px;">          <img id="pageAffichee" class="imagePORTRAIT" alt="2" />          </div>

          <!-- IMAGE SUIVANTE en cache -->
          <img id="pageCachee" src="images/quran13lsabah_aim/quran13lsabah_aim (3).jpg" alt="imagecache" hidden />
          <!-- IMAGE SUIVANTE +2 en cache -->
          <img id="pageCachee2" src="" alt="imagecache" hidden />

          <!-- CHOIX DE LA PAGE -->
          PAGE
          <input type="number" id="selectPAGE" name="selectPAGE" min="1" max="848" value="2" onchange="quranDisplay.displayPage(this.value)">
        </center>
      </main>
    </div>
  

<script type="module">
  import { affichageHTML } from './js/affichage.js';
  import { loadConfig } from './js/configLoader.js';

  await loadConfig();

  const _run = (fn) => {
    try { fn(); } catch (e) { console.warn('affichageHTML bootstrap:', e); }
  };

  _run(() => { document.querySelector('header').innerHTML = affichageHTML('header','','','6'); });
  _run(() => { document.getElementById('drawer').innerHTML = affichageHTML('drawer','','','6'); });
  _run(() => { document.getElementById('parametres').innerHTML = affichageHTML('parametres','13lsabah_aim','simple',''); });

  if (window.componentHandler && typeof window.componentHandler.upgradeDom === 'function') {
    window.componentHandler.upgradeDom();
  }
</script>
