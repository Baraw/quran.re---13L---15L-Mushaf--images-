<script>
  window.addEventListener('load', () => {
    const key = 'moushaf13L_shown';
    if (!localStorage.getItem(key)) {
      const msg = 
        "Une version texte du Moushaf du Qouran 13L est disponible.\n\n" +
        "Voulez-vous y accéder ?";
      if (confirm(msg)) {
        window.location.href = "https://quran.re/app";
      }
      localStorage.setItem(key, '1');
    }
  });
</script>
