  <script type="module">
  import { affichageHTML } from '../js/affichage.js';
  import { loadConfig } from '../js/configLoader.js';

  await loadConfig();

  const set = (selector, html) => {
    const el = document.querySelector(selector);
    if (el) el.innerHTML = html;
  };
  const setId = (id, html) => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  };

  set('header', affichageHTML('header','','','5'));
  setId('drawer', affichageHTML('drawer','','','5'));
  setId('parametres', affichageHTML('parametres','13lenglish','simple','2penglish'));
  setId('selectSDQ', affichageHTML('selectSDQ','13lenglish','simple',''));
  setId('selectLecture', affichageHTML('selectLecture','13lenglish','simple',''));
  set('footer', affichageHTML('footer','13lenglish','simple', ''));

  if (window.componentHandler && typeof window.componentHandler.upgradeDom === 'function') {
    window.componentHandler.upgradeDom();
  }
